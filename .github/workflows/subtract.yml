name: Calculate

on:
  workflow_dispatch:

jobs:
  calculate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run calc.py
        id: calc
        run: |
          RESULT=$(python calc.py)
          echo "result=$RESULT" >> $GITHUB_OUTPUT

      - name: Run multiply.py
        run: |
          python multiply.py "${{ steps.calc.outputs.result }}"
